<!DOCTYPE html>
<html lang="en">
<head>
    <title>Contact Me</title>
    <link rel="icon" type="image/x-icon" href="/Images/plumbpro.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Comfortaa:wght@300;400&display=swap" rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Times New Roman', sans-serif;
            background-color: darkslategrey;
            width: 100%;
            overflow-x: hidden;
        }

        p,
        input,
        textarea {
            font-size: 18px;
        }

        /* NAVBAR */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            background-color: tan;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        /* LOGO */
        .logo a {
            display: flex;
            align-items: center;
            gap: 12px;
            color: white;
            text-decoration: none;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .logo img {
            height: 65px;
            width: auto;
            object-fit: contain;
            border: 2px outset black;
        }

        /* HAMBURGER BUTTON */
        .menu-toggle {
            font-size: 2rem;
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            padding: 10px;
        }

        /* SIDE MENU */
        .side-menu {
            position: fixed;
            top: 0;
            right: -280px;
            width: 260px;
            height: 100%;
            background-color: black;
            display: flex;
            flex-direction: column;
            padding: 80px 25px 25px;
            gap: 20px;
            transition: right 0.3s ease;
            z-index: 2000;
        }

            .side-menu.active {
                right: 0;
            }

            .side-menu a,
            .mobile-dropbtn {
                color: white;
                text-decoration: none;
                font-size: 20px;
                font-weight: bold;
                background: none;
                border: none;
                text-align: left;
                cursor: pointer;
                padding: 12px 0;
                width: 100%;
            }

                .side-menu a:hover,
                .mobile-dropbtn:hover {
                    color: tan;
                }

        /* CLOSE BUTTON */
        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 2rem;
            background: none;
            border: none;
            color: white;
            cursor: pointer;
        }

        /* MOBILE DROPDOWN */
        .mobile-dropdown-content {
            display: none;
            flex-direction: column;
            padding-left: 15px;
        }

        .mobile-dropdown.active .mobile-dropdown-content {
            display: flex;
        }

        .mobile-dropdown-content a {
            font-size: 18px;
            padding: 8px 0;
        }

        /* OVERLAY */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            opacity: 0;
            visibility: hidden;
            transition: 0.3s ease;
            z-index: 1500;
        }

            .overlay.active {
                opacity: 1;
                visibility: visible;
            }

        /* CONTENT */
        .content {
            width: 100%;
            padding: 25px 15px;
        }

        /* CONTACT CONTAINER */
        .footer-container {
            background-color: black;
            color: #f1f1f1;
            text-align: center;
            box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.2);
            border-radius: 25px;
            padding: 30px 20px;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            border: 3px outset tan;
        }

        .contact-section {
            width: 100%;
        }

            .contact-section h1 {
                font-size: 2.2rem;
                margin-bottom: 20px;
            }

        /* FORM */
        form {
            width: 100%;
            max-width: 600px;
            margin: 30px auto 0 auto;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        input,
        textarea {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #ccc;
            font-family: 'Times New Roman', sans-serif;
        }

        textarea {
            resize: vertical;
        }

        button.submit-btn {
            padding: 14px;
            border: none;
            border-radius: 25px;
            background-color: tan;
            color: black;
            font-weight: bold;
            cursor: pointer;
            font-size: 18px;
            transition: 0.3s ease;
        }

            button.submit-btn:hover {
                background-color: #d2a679;
            }

        /* MOBILE */
        @media (max-width: 768px) {

            .logo a {
                font-size: 1.2rem;
            }

            .logo img {
                height: 55px;
            }

            .contact-section h1 {
                font-size: 1.8rem;
            }

            p {
                font-size: 16px;
            }

            input,
            textarea,
            button.submit-btn {
                font-size: 16px;
            }

            .footer-container {
                padding: 25px 15px;
            }

        /*email*/
            
        }
    </style>

    <script>

        function sendEmail() {

            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;
            const message = document.getElementById("message").value;

            const subject =
                encodeURIComponent(`New Contact Form Message from ${name}`);

            const body =
                encodeURIComponent(
                    `Email: ${email}

    Message:
    ${message}`
                );

            window.location.href =
                `mailto:plumbprosuazo@gmail.com?subject=${subject}&body=${body}`;
        }

    </script>
</head>


<body>

    <!-- NAVBAR -->
    <div class="navbar">

        <!-- LOGO -->
        <div class="logo">
            <a href="/index.html">
                <img src="/Images/plumbpro.png" alt="Logo">
                <span>Suazo PlumbPro</span>
            </a>
        </div>

        <!-- HAMBURGER -->
        <button class="menu-toggle" id="menu-toggle">
            ☰
        </button>

        <!-- SIDE MENU -->
        <div class="side-menu" id="side-menu">

            <button class="close-btn" id="close-btn">
                ×
            </button>

            <a href="/index.html">Home</a>

            <div class="mobile-dropdown">

                <button class="mobile-dropbtn">
                    Services ▾
                </button>

                <div class="mobile-dropdown-content">
                    <a href="/Plumbing.html">Suazo Plumbing</a>
                    <a href="/Trailer.html">Suazo Trailer</a>
                </div>

            </div>

            <a href="/Contact.html">Contact Me</a>

        </div>

        <!-- OVERLAY -->
        <div class="overlay" id="overlay"></div>

    </div>

    <!-- CONTENT -->
    <div class="content">

        <div class="footer-container">

            <div class="contact-section">

                <h1>Contact Me</h1>

                <p>Phone Number: (213) 864 - 1738</p>

                <p>Email: plumbprosuazo@gmail.com</p>

                <p>Or</p>

                <p>
                    Leave your name, email, and the problem you are currently
                    facing and I will be happy to help!
                </p>

                <div class="email-box">

                    <input type="text"
                           id="name"
                           placeholder="Your Name"
                           required>

                    <input type="email"
                           id="email"
                           placeholder="Your Email"
                           required>

                    <textarea id="message"
                              rows="5"
                              placeholder="Describe your issue..."
                              required></textarea>

                    <button class="submit-btn" onclick="sendEmail()">
                        Send Message
                    </button>

                </div>

            </div>

        </div>

    </div>

    <!-- SCRIPT -->
    <script>const menuToggle = document.getElementById('menu-toggle');
        const sideMenu = document.getElementById('side-menu');
        const closeBtn = document.getElementById('close-btn');
        const overlay = document.getElementById('overlay');

        /* OPEN MENU */
        menuToggle.addEventListener('click', () => {
            sideMenu.classList.add('active');
            overlay.classList.add('active');
        });

        /* CLOSE MENU */
        closeBtn.addEventListener('click', closeMenu);
        overlay.addEventListener('click', closeMenu);

        function closeMenu() {
            sideMenu.classList.remove('active');
            overlay.classList.remove('active');
        }

        /* DROPDOWN */
        const dropdown = document.querySelector('.mobile-dropdown');
        const dropBtn = document.querySelector('.mobile-dropbtn');

        dropBtn.addEventListener('click', () => {
            dropdown.classList.toggle('active');
        });</script>

</body>
</html>
